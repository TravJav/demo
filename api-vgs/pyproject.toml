[project]
name = "api-vgs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
lint = [
    "ruff>=0.16.3",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
